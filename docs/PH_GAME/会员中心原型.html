<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>会员中心原型 - 游戏管理后台系统</title>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-2: #f9fafb;
      --line: #dfe5eb;
      --line-soft: #edf1f5;
      --text: #182230;
      --text-2: #536273;
      --muted: #8794a3;
      --nav: #061a2b;
      --nav-2: #09243a;
      --nav-line: rgba(255, 255, 255, 0.1);
      --accent: #0bbf9a;
      --accent-dark: #078c74;
      --blue: #1667d8;
      --blue-soft: #eaf2ff;
      --green: #1f8a3b;
      --green-soft: #e9f7ee;
      --red: #d43d3d;
      --red-soft: #fff0f0;
      --amber: #b66a00;
      --amber-soft: #fff5df;
      --shadow: 0 12px 34px rgba(26, 38, 52, 0.08);
      --radius: 8px;
      --radius-sm: 6px;
      --font: -apple-system, "SF Pro Text", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      letter-spacing: 0;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.6;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app-shell {
      min-height: 100dvh;
      display: grid;
      grid-template-columns: 224px minmax(0, 1fr);
      background: var(--bg);
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100dvh;
      background: linear-gradient(180deg, var(--nav), var(--nav-2));
      color: #d8e3ee;
      display: flex;
      flex-direction: column;
      min-width: 0;
      z-index: 20;
    }

    .brand {
      height: 58px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      border-bottom: 1px solid var(--nav-line);
      font-weight: 700;
      color: #fff;
    }

    .brand-mark {
      width: 28px;
      height: 22px;
      position: relative;
      border-radius: 5px;
      background: linear-gradient(135deg, #0bbf9a 0%, #1667d8 100%);
      transform: skew(-12deg);
    }

    .brand-mark::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      border: 3px solid #fff;
      border-left: 0;
      border-bottom: 0;
      right: 5px;
      top: 4px;
      opacity: 0.85;
    }

    .brand small {
      display: block;
      color: #8fa4b9;
      font-weight: 500;
      font-size: 11px;
      line-height: 1;
      margin-top: 2px;
    }

    .side-section-title {
      padding: 14px 16px 7px;
      color: #8fa4b9;
      font-size: 12px;
    }

    .side-nav {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 0 8px 14px;
      overflow: auto;
    }

    .side-nav button {
      width: 100%;
      border: 0;
      background: transparent;
      color: #d6e0ea;
      border-radius: var(--radius-sm);
      text-align: left;
    }

    .nav-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .nav-parent {
      min-height: 38px;
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr) 18px;
      align-items: center;
      gap: 8px;
      padding: 0 8px;
    }

    .side-nav button:hover {
      background: rgba(255, 255, 255, 0.07);
    }

    .nav-parent.active {
      background: rgba(11, 191, 154, 0.14);
      color: #fff;
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .nav-icon {
      width: 20px;
      height: 20px;
      display: grid;
      place-items: center;
      color: #95abc0;
    }

    .nav-icon svg,
    .btn svg,
    .icon-button svg,
    .mini-action svg,
    .crumb svg {
      width: 16px;
      height: 16px;
      stroke-width: 1.9;
    }

    .nav-parent.active .nav-icon {
      color: var(--accent);
    }

    .nav-label {
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 600;
      font-size: 13px;
    }

    .nav-count {
      font-size: 11px;
      color: #a9b7c5;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.08);
      min-width: 24px;
      padding: 1px 5px;
      border-radius: 999px;
      text-align: center;
    }

    .nav-chevron {
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      color: #8fa4b9;
      transform: rotate(-90deg);
      transition: transform 160ms ease, color 160ms ease;
    }

    .nav-group.open .nav-chevron {
      transform: rotate(0deg);
      color: #cbd7e4;
    }

    .nav-children {
      display: none;
      flex-direction: column;
      gap: 2px;
      padding: 2px 0 6px 30px;
    }

    .nav-group.open .nav-children {
      display: flex;
    }

    .nav-child {
      min-height: 32px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 8px;
      color: #aebdcc;
      font-size: 13px;
    }

    .nav-child .nav-label {
      font-weight: 500;
    }

    .nav-child.active {
      color: #fff;
      background: rgba(255, 255, 255, 0.09);
      font-weight: 700;
    }

    .side-footer {
      margin-top: auto;
      padding: 12px;
      border-top: 1px solid var(--nav-line);
    }

    .status-block {
      border: 1px solid rgba(255, 255, 255, 0.09);
      background: rgba(255, 255, 255, 0.05);
      border-radius: var(--radius);
      padding: 10px;
      color: #b8c7d6;
      font-size: 12px;
    }

    .status-block strong {
      display: block;
      color: #fff;
      font-size: 13px;
      margin-bottom: 2px;
    }

    .main {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 18px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 15;
    }

    .top-left,
    .top-right,
    .crumb,
    .quick-tabs,
    .filters,
    .form-row,
    .button-row,
    .table-tools,
    .summary-line,
    .state-tabs,
    .drawer-title,
    .toast,
    .mini-action {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .crumb {
      color: var(--text-2);
      font-weight: 600;
    }

    .crumb b {
      color: var(--blue);
    }

    .quick-tabs {
      border-left: 1px solid var(--line);
      padding-left: 12px;
      overflow: hidden;
    }

    .quick-tab {
      min-height: 30px;
      border: 1px solid var(--line);
      background: var(--surface-2);
      border-radius: var(--radius-sm);
      color: var(--text-2);
      padding: 4px 10px;
      white-space: nowrap;
      font-size: 12px;
    }

    .quick-tab.active {
      border-color: rgba(11, 191, 154, 0.38);
      background: #e8faf6;
      color: var(--accent-dark);
      font-weight: 700;
    }

    .searchbox {
      min-height: 34px;
      width: min(280px, 28vw);
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr);
      align-items: center;
      gap: 6px;
      padding: 0 10px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      color: var(--muted);
    }

    .searchbox input {
      border: 0;
      outline: 0;
      background: transparent;
      min-width: 0;
      color: var(--text);
    }

    .locale-pill,
    .user-pill {
      min-height: 32px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 0 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-2);
      white-space: nowrap;
      background: var(--surface);
      font-size: 12px;
    }

    .user-avatar {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--blue));
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 800;
    }

    .workspace {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 284px;
      gap: 12px;
      padding: 12px;
      align-items: start;
      transition: grid-template-columns 180ms ease;
    }

    .workspace.rail-collapsed {
      grid-template-columns: minmax(0, 1fr) 44px;
    }

    .workspace.no-rail,
    .workspace.no-rail.rail-collapsed {
      grid-template-columns: minmax(0, 1fr);
    }

    .content {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .page-head {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: start;
    }

    .page-title {
      margin: 0;
      font-size: 18px;
      line-height: 1.3;
      font-weight: 800;
    }

    .page-summary {
      margin: 5px 0 0;
      color: var(--text-2);
      font-size: 13px;
    }

    .head-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .btn,
    .icon-button,
    .mini-action {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: #fff;
      color: var(--text-2);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 11px;
      white-space: nowrap;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease, transform 120ms ease;
    }

    .btn:hover,
    .icon-button:hover,
    .mini-action:hover {
      border-color: #c9d2dc;
      color: var(--text);
      background: var(--surface-2);
    }

    .btn:active,
    .icon-button:active,
    .mini-action:active {
      transform: translateY(1px);
    }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 700;
    }

    .btn.blue {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
      font-weight: 700;
    }

    .btn.danger {
      color: var(--red);
      border-color: rgba(212, 61, 61, 0.35);
      background: var(--red-soft);
    }

    .btn:disabled {
      cursor: not-allowed;
      color: var(--muted);
      border-color: var(--line);
      background: var(--surface-2);
      opacity: 0.72;
    }

    .icon-button {
      width: 34px;
      padding: 0;
    }

    .filter-panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(4, minmax(150px, 1fr)) auto;
      gap: 10px;
      align-items: end;
    }

    .filters.dense {
      grid-template-columns: repeat(6, minmax(126px, 1fr));
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
    }

    .field label {
      font-size: 12px;
      color: var(--text-2);
      font-weight: 700;
    }

    .field input,
    .field select,
    .field textarea {
      min-height: 34px;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: #fff;
      color: var(--text);
      padding: 0 10px;
      outline: 0;
    }

    .field textarea {
      min-height: 84px;
      padding: 8px 10px;
      resize: vertical;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(22, 103, 216, 0.12);
    }

    .member-list-shell {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .member-list-tabs {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      border-bottom: 1px solid var(--line);
      padding-bottom: 6px;
    }

    .member-list-tabs button {
      min-height: 32px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
      color: var(--text-2);
      padding: 0 13px;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 700;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
    }

    .member-list-tabs button.active {
      color: #fff;
      background: var(--blue);
      border-color: var(--blue);
    }

    .member-list-filter-panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px 12px;
    }

    .member-list-filter-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .member-list-advanced-toggle {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 30px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: #fff;
      color: var(--text-2);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .member-list-advanced-toggle.active {
      border-color: rgba(22, 103, 216, 0.32);
      background: var(--blue-soft);
      color: var(--blue);
    }

    .member-list-filter-grid {
      display: grid;
      gap: 8px 10px;
      align-items: center;
    }

    .member-list-filter-grid.primary {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .member-list-filter-advanced {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 180ms ease;
    }

    .member-list-filter-advanced.open {
      grid-template-rows: 1fr;
    }

    .member-list-filter-advanced-inner {
      min-height: 0;
      overflow: hidden;
    }

    .member-list-filter-advanced.open .member-list-filter-advanced-inner {
      padding-top: 8px;
    }

    .member-list-filter-grid.advanced {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .member-list-field {
      min-width: 0;
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      align-items: center;
      gap: 6px;
    }

    .member-list-label {
      font-size: 11px;
      color: var(--text-2);
      font-weight: 600;
      text-align: right;
      white-space: nowrap;
    }

    .member-list-control,
    .member-list-field input,
    .member-list-field select,
    .member-list-date-range input,
    .member-list-money-range input,
    .member-list-money-range select {
      min-height: 30px;
      min-width: 0;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: #fff;
      color: var(--text);
      padding: 0 8px;
      outline: 0;
      font-size: 12px;
    }

    .member-list-control:focus,
    .member-list-field input:focus,
    .member-list-field select:focus,
    .member-list-date-range input:focus,
    .member-list-money-range input:focus,
    .member-list-money-range select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(22, 103, 216, 0.1);
    }

    .member-list-combo {
      display: grid;
      grid-template-columns: 108px minmax(0, 1fr);
      min-width: 0;
      min-height: 30px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: #fff;
      overflow: hidden;
    }

    .member-list-combo .member-list-control,
    .member-list-combo input {
      border: 0;
      border-radius: 0;
      min-height: 28px;
      box-shadow: none;
      font-size: 12px;
    }

    .member-list-combo input {
      border-left: 1px solid var(--line-soft);
    }

    .member-list-search {
      grid-column: span 2;
    }

    .member-list-medium {
      grid-column: span 2;
    }

    .member-list-wide {
      grid-column: span 2;
    }

    .member-list-money {
      grid-column: span 2;
    }

    .member-list-money-range {
      display: grid;
      grid-template-columns: minmax(96px, 0.95fr) minmax(0, 1fr) 20px minmax(0, 1fr);
      align-items: center;
      min-width: 0;
      min-height: 30px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: #fff;
      overflow: hidden;
    }

    .member-list-money-range .member-list-control,
    .member-list-money-range input {
      border: 0;
      border-radius: 0;
      min-height: 28px;
      box-shadow: none;
      font-size: 12px;
    }

    .member-list-money-range input {
      border-left: 1px solid var(--line-soft);
    }

    .member-list-money-range span,
    .member-list-date-range span {
      color: var(--muted);
      text-align: center;
      font-size: 11px;
    }

    .member-list-date {
      grid-column: span 2;
    }

    .member-list-date-range {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 20px minmax(0, 1fr);
      align-items: center;
      min-width: 0;
      min-height: 30px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: #fff;
      overflow: hidden;
    }

    .member-list-date-range input,
    .member-list-date-range input:first-child,
    .member-list-date-range input:last-child {
      border: 0;
      border-radius: 0;
      min-height: 28px;
      box-shadow: none;
      font-size: 12px;
    }

    .member-list-tags {
      grid-column: span 2;
    }

    .member-list-tag-select {
      position: relative;
      width: 100%;
    }

    .member-list-tag-select summary {
      min-height: 30px;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: #fff;
      color: var(--text);
      padding: 0 8px;
      outline: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      list-style: none;
      font-size: 12px;
    }

    .member-list-tag-select summary::-webkit-details-marker {
      display: none;
    }

    .member-list-tag-select summary::after {
      content: "⌄";
      color: var(--muted);
      font-size: 13px;
    }

    .member-list-tag-select[open] summary {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(22, 103, 216, 0.1);
    }

    .member-list-tag-menu {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      z-index: 20;
      width: min(360px, 100vw - 32px);
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px 10px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      box-shadow: var(--shadow);
    }

    .member-list-tag-menu label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--text);
      font-size: 12px;
      white-space: nowrap;
    }

    .member-list-tag-menu input {
      width: 14px;
      height: 14px;
      accent-color: var(--blue);
    }

    .tag-batch-tag-select {
      width: 100%;
    }

    .tag-batch-tag-line {
      align-items: start;
    }

    .tag-batch-tag-line > label {
      padding-top: 8px;
    }

    .tag-batch-remark-line {
      align-items: start;
    }

    .tag-batch-remark-line > label {
      padding-top: 8px;
    }

    .member-list-form-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 30px;
    }

    .member-list-form-actions .btn {
      min-height: 30px;
      padding: 0 14px;
      font-size: 12px;
    }

    .member-list-table-tools .tool-actions {
      gap: 8px;
    }

    .table-tools.member-list-table-tools {
      justify-content: flex-end;
      border-bottom: 0;
      padding: 6px 8px 7px;
    }

    .member-list-table-tools .summary-line {
      display: none;
    }

    .member-list-table-wrap {
      overflow: auto;
      max-width: 100%;
    }

    .member-list-table {
      min-width: 3200px;
    }

    .member-list-sticky-col {
      position: sticky;
      right: 0;
      z-index: 2;
      min-width: 252px;
      width: 252px;
      background: #fff;
      box-shadow: -10px 0 14px -12px rgba(15, 23, 42, 0.22);
      vertical-align: top;
    }

    .member-list-table thead .member-list-sticky-col {
      top: 0;
      z-index: 4;
      background: #fbfcfd;
    }

    .member-list-table tbody tr:hover .member-list-sticky-col {

      position: absolute;
      top: 0;
      right: 0;
      width: min(520px, 92vw);
      height: 100%;
      background: var(--surface);
      border-left: 1px solid var(--line);
      box-shadow: var(--shadow);
      transform: translateX(102%);
      transition: transform 220ms ease;
      display: flex;
      flex-direction: column;
    }

    .drawer.open .drawer-panel {
      transform: translateX(0);
    }

    .drawer-head {
      min-height: 58px;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .drawer-body {
      padding: 16px;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .detail-item {
      border: 1px solid var(--line-soft);
      background: var(--surface-2);
      border-radius: var(--radius-sm);
      padding: 10px;
      min-width: 0;
    }

    .detail-item span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 4px;
    }

    .detail-item b {
      display: block;
      color: var(--text);
      overflow-wrap: anywhere;
    }

    .timeline {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 2px 0;
    }

    .timeline-item {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr);
      gap: 8px;
      color: var(--text-2);
      font-size: 13px;
    }

    .timeline-item::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      margin-top: 7px;
      box-shadow: 0 0 0 4px #e8faf6;
    }

    .modal {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(760px, 94vw);
      max-height: min(720px, 88vh);
      transform: translate(-50%, -48%) scale(0.98);
      opacity: 0;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      transition: opacity 180ms ease, transform 180ms ease;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .modal.member-modal {
      width: min(1120px, 96vw);
      max-height: min(760px, 92vh);
    }

    .modal-backdrop.open .modal {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    .modal-head,
    .modal-foot {
      min-height: 56px;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .modal-foot {
      border-top: 1px solid var(--line);
      border-bottom: 0;
      justify-content: flex-end;
    }

    .modal-body {
      padding: 16px;
      overflow: auto;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .member-detail-body {
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }

    .member-card-nav {
      position: sticky;
      top: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 0 10px;
      margin-top: -8px;
      background: #fff;
      border-bottom: 1px solid var(--line-soft);
      overflow-x: auto;
    }

    .member-card-nav button {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      color: var(--text-2);
      padding: 0 14px;
      white-space: nowrap;
      font-weight: 700;
    }

    .member-card-nav button:hover,
    .member-card-nav button.active {
      color: var(--blue);
      background: var(--blue-soft);
      border-color: rgba(22, 103, 216, 0.22);
    }

    .member-action-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 2px 0 10px;
      border-bottom: 1px solid var(--line);
    }

    .member-action-label {
      color: var(--text-2);
      font-weight: 800;
      padding: 0 6px;
      white-space: nowrap;
    }

    .member-section {
      scroll-margin-top: 72px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      overflow-x: auto;
      overflow-y: hidden;
    }

    .member-section-head {
      min-height: 40px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid var(--line-soft);
      background: #fbfcfd;
      font-weight: 800;
    }

    .member-section-head span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .member-info-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0;
    }

    .member-info-item {
      min-height: 42px;
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
      padding: 8px 12px;
      border-right: 1px solid var(--line-soft);
      border-bottom: 1px solid var(--line-soft);
      font-size: 13px;
    }

    .member-info-item span {
      color: var(--text-2);
      font-weight: 700;
    }

    .member-info-item b {
      min-width: 0;
      overflow-wrap: anywhere;
      font-weight: 600;
    }

    .member-tag-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line-soft);
    }

    .member-note-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      padding: 12px;
      border-bottom: 1px solid var(--line-soft);
    }

    .member-note-row input {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 0 10px;
      outline: 0;
    }

    .member-mini-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }

    .member-mini-table th,
    .member-mini-table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line-soft);
      white-space: normal;
      vertical-align: top;
    }

    .member-mini-table th {
      background: #f3f5f7;
      color: var(--text);
      font-weight: 800;
    }

    .member-mini-table tbody tr:hover {
      background: #fbfcfd;
    }

    .member-sub-tabs {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 2px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line-soft);
      background: #fff;
    }

    .member-sub-tabs button {
      min-height: 34px;
      border: 0;
      border-radius: 0;
      background: #f3f4f6;
      color: var(--text-2);
      padding: 0 14px;
      font-weight: 700;
    }

    .member-sub-tabs button.active {
      color: var(--blue);
      background: #fff;
    }

    .member-finance-block {
      padding: 12px;
      border-bottom: 1px solid var(--line-soft);
    }

    .member-block-title {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      font-weight: 800;
      margin-bottom: 10px;
    }

    .member-block-title svg {
      width: 16px;
      height: 16px;
      color: var(--blue);
    }

    .member-asset-row,
    .member-limit-row,
    .member-record-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px 18px;
      align-items: center;
      font-size: 13px;
    }

    .member-record-row {
      grid-template-columns: minmax(220px, 1fr) 130px minmax(220px, 1fr) 130px;
      padding: 8px 0;
    }

    .member-kv {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .member-kv span {
      color: var(--text-2);
      font-weight: 700;
      white-space: nowrap;
    }

    .member-kv b {
      min-width: 0;
      overflow-wrap: anywhere;
      font-weight: 700;
    }

    .member-help {
      width: 16px;
      height: 16px;
      border: 1px solid var(--line);
      border-radius: 50%;
      display: inline-grid;
      place-items: center;
      color: var(--muted);
      font-size: 11px;
      line-height: 1;
    }

    .member-hidden-panel {
      min-height: 166px;
      margin-top: 12px;
      display: grid;
      place-items: center;
      background: #d8d8d8;
      color: #30363d;
      font-weight: 800;
    }

    .member-gray-chip {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      max-width: 100%;
      background: #8a8f96;
      color: #fff;
      padding: 0 9px;
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .member-record-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .member-filter-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 12px;
      border-bottom: 1px solid var(--line-soft);
    }

    .member-filter-row .btn {
      min-height: 34px;
      padding: 0 14px;
    }

    .member-filter-row input,
    .member-filter-row select {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: #fff;
      padding: 0 10px;
      color: var(--text);
      outline: 0;
    }

    .member-filter-row input {
      width: 138px;
    }

    .member-game-matrix {
      width: calc(100% - 24px);
      min-width: 760px;
      margin: 12px;
      border-collapse: collapse;
      border: 1px solid var(--line);
    }

    .member-game-matrix th,
    .member-game-matrix td {
      padding: 11px 12px;
      border: 1px solid var(--line-soft);
      vertical-align: top;
    }

    .member-game-matrix th {
      background: #f7f8fa;
      font-weight: 800;
    }

    .member-game-matrix th:first-child,
    .member-game-matrix td:first-child {
      width: 120px;
      text-align: center;
      font-weight: 800;
      background: #fbfcfd;
    }

    .member-game-checks {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
    }

    .member-game-checks label,
    .member-select-all {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 24px;
      color: var(--text-2);
      white-space: nowrap;
    }

    .member-game-foot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 0 12px 14px;
    }

    .member-game-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      padding: 12px;
    }

    .member-game-card {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .member-game-card b {
      display: block;
    }

    .member-game-card span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }

    .member-profile-modal {
      width: min(1220px, 96vw);
    }

    .member-profile-head {
      position: relative;
      justify-content: center;
    }

    .member-profile-head strong {
      font-size: 15px;
    }

    .member-profile-head .icon-button {
      position: absolute;
      right: 14px;
    }

    .member-profile-body {
      display: block;
      padding: 16px 12px 18px;
      background: #fff;
    }

    .profile-summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      overflow: hidden;
      margin-bottom: 12px;
      background: #fff;
    }

    .profile-summary-item {
      min-height: 38px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border-right: 1px solid var(--line-soft);
      color: var(--text-2);
      font-size: 12px;
      white-space: nowrap;
      min-width: 0;
    }

    .profile-summary-item:last-child {
      border-right: 0;
    }

    .profile-summary-item span {
      color: var(--muted);
      font-weight: 700;
      flex: 0 0 auto;
    }

    .profile-summary-item b,
    .profile-summary-item .profile-summary-value {
      min-width: 0;
      color: var(--text);
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .profile-tag-row {
      min-height: 38px;
      display: grid;
      grid-template-columns: 82px minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      margin: -4px 0 12px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: #fbfcfd;
    }

    .profile-tag-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .profile-tag-list {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      min-width: 0;
    }

    .profile-tag-pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--text-2);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .profile-tag-pill.active {
      border-color: rgba(22, 103, 216, 0.24);
      background: var(--blue-soft);
      color: var(--blue);
      font-weight: 800;
    }

    .profile-copy {
      min-height: 20px;
      display: inline-flex;
      align-items: center;
      vertical-align: middle;
      margin-left: 3px;
    }

    .profile-copy svg {
      width: 13px;
      height: 13px;
    }

    .profile-table-wrap {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      overflow: auto;
      background: #fff;
    }

    .member-profile-table {
      width: 100%;
      min-width: 1080px;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 12px;
    }

    .profile-col-label {
      width: 132px;
    }

    .profile-col-actions {
      width: 268px;
    }

    .member-profile-table td {
      min-height: 38px;
      padding: 7px 10px;
      border-right: 1px solid var(--line-soft);
      border-bottom: 1px solid var(--line-soft);
      vertical-align: middle;
      line-height: 1.55;
    }

    .member-profile-table tr:last-child td {
      border-bottom: 0;
    }

    .profile-group td {
      background: #f3f6fa;
      color: var(--text);
      font-weight: 900;
      letter-spacing: 0;
      border-right: 0;
    }

    .profile-label {
      width: auto;
      min-width: 108px;
      max-width: 148px;
      background: #fbfcfd;
      color: var(--text-2);
      font-weight: 800;
      font-size: 12px;
      line-height: 1.45;
      text-align: right;
      white-space: normal;
      word-break: break-word;
      vertical-align: top;
      padding-top: 9px;
    }

    .profile-period-label {
      min-width: 96px;
      max-width: 112px;
      padding-top: 10px;
    }

    .profile-period-name {
      display: block;
      color: var(--text);
      font-weight: 800;
      font-size: 12px;
      line-height: 1.4;
    }

    .profile-period-dims {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      line-height: 1.35;
    }

    .profile-period-row .profile-period-value {
      padding-top: 8px;
      padding-bottom: 8px;
      vertical-align: top;
    }

    .profile-value {
      color: var(--text);
      font-weight: 600;
      overflow-wrap: anywhere;
      word-break: break-word;
      white-space: normal;
    }

    .profile-value span,
    .profile-value b,
    .profile-value small {
      max-width: 100%;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .muted-value {
      display: inline;
      color: var(--muted);
      font-weight: 600;
      margin-left: 6px;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .profile-value.muted-value {
      color: var(--muted);
      font-weight: 600;
    }

    .profile-actions-cell {
      border-right: 0;
    }

    .profile-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px 12px;
    }

    .profile-actions:empty::before {
      content: "-";
      color: var(--muted);
    }

    .link-btn.danger-link {
      color: var(--red);
    }

    .profile-metric {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
    }

    .profile-metric small {
      color: var(--muted);
      font-size: 12px;
    }

    .profile-dual-metrics {
      display: flex;
      align-items: stretch;
      flex-wrap: wrap;
      gap: 6px;
    }

    .profile-triple-metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(104px, 1fr));
      gap: 6px;
      width: 100%;
    }

    .profile-triple-metrics .profile-dual-metric {
      min-width: 0;
      width: 100%;
      padding: 4px 8px;
      box-sizing: border-box;
    }

    .profile-dual-metric {
      display: inline-flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 4px 5px;
      min-width: 0;
      padding: 2px 8px;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius-sm);
      background: #fbfcfd;
    }

    .profile-dual-metric small {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .profile-dual-metric b,
    .profile-dual-metric .amount-positive,
    .profile-dual-metric .amount-negative {
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .profile-device {
      display: grid;
      gap: 2px;
    }

    .profile-device small {
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .profile-note-inline {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .profile-note-inline input {
      width: 100%;
      min-height: 30px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 0 9px;
      color: var(--text);
      outline: 0;
    }

    .wide-field {
      grid-column: 1 / -1;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%) translateY(12px);
      background: #102033;
      color: #fff;
      border-radius: var(--radius-sm);
      padding: 10px 13px;
      box-shadow: var(--shadow);
      z-index: 80;
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
      font-size: 13px;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .loading-mask {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.72);
      display: none;
      place-items: center;
      z-index: 5;
    }

    .loading-mask.show {
      display: grid;
    }

    .loader-line {
      width: 160px;
      height: 8px;
      border-radius: 999px;
      background: var(--line-soft);
      overflow: hidden;
      position: relative;
    }

    .loader-line::after {
      content: "";
      position: absolute;
      inset: 0;
      width: 45%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--blue));
      animation: loading 900ms ease-in-out infinite alternate;
    }

    @keyframes loading {
      from { transform: translateX(-15%); }
      to { transform: translateX(135%); }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 1320px) {
      .workspace {
        grid-template-columns: minmax(0, 1fr);
      }

      .insight-rail {
        display: none;
      }

      .metric-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 980px) {
      .app-shell {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: relative;
        height: auto;
      }

      .side-nav {
        display: flex;
        flex-direction: column;
        max-height: 260px;
      }

      .nav-children {
        padding-left: 26px;
      }

      .side-footer,
      .side-section-title {
        display: none;
      }

      .topbar {
        top: 0;
        align-items: stretch;
        height: auto;
        min-height: 52px;
        flex-direction: column;
        padding: 10px 12px;
      }

      .top-left,
      .top-right {
        width: 100%;
        justify-content: space-between;
      }

      .quick-tabs,
      .locale-pill {
        display: none;
      }

      .searchbox {
        width: min(100%, 360px);
      }

      .workspace {
        grid-template-columns: 1fr;
      }

      .page-head {
        grid-template-columns: 1fr;
      }

      .head-actions {
        justify-content: flex-start;

      const moneyRange = (prefix, ariaPrefix) => `

        </label>
        ${field("用户状态", select("member-list-status", ["全部", "正常", "登录锁定", "充值锁定", "游戏锁定"], "用户状态"))}
        ${field("账号类型", select("member-list-type", ["全部", "正式", "测试"], "账号类型"))}
        ${field("VIP等级", select("member-list-vip", ["全部", "VIP0", "VIP1", "VIP2", "VIP3", "VIP4", "VIP5"], "VIP等级"))}
        ${field("会员层级", select("member-list-level", levelOptions, "会员层级", selectedLevel), "member-list-wide")}
      `;
      const advancedFilters = `
        ${field("总代", select("member-list-general-agent", ["全部", "GD-BR-01", "GD-BR-02", "GD-MX-01", "GD-PH-01"], "总代"))}
        ${field("团队", select("member-list-team", ["全部", "Team-Alpha", "Team-Bravo", "Team-Charlie", "Team-Delta"], "团队"))}
        ${field("小组", select("member-list-squad", ["全部", "小组-01", "小组-02", "小组-03", "小组-04"], "小组"))}
        ${field("渠道", select("member-list-channel", ["全部", "Facebook投放", "Google SEM", "代理推荐", "PWA自然量", "官方渠道"], "渠道"))}
        ${field("注册方式", select("member-list-register-method", ["全部", "手机号", "邮箱"], "注册方式"))}
        ${field("注册时间", dateRange("member-list-register-start", "member-list-register-end"), "member-list-date")}
        ${field("货币", select("member-list-currency", ["全部", "BRL", "PHP", "MXN", "COP", "CLP"], "货币"))}
        ${field("标签", `
          <details class="member-list-tag-select">
            <summary>请选择标签</summary>
            <div class="member-list-tag-menu" aria-label="会员标签多选">
              ${memberTagOptions.map((label) => `
                <label><input type="checkbox" value="${label}" />${label}</label>
              `).join("")}
            </div>
          </details>
        `, "member-list-tags")}
        ${field("首充时间", dateRange("member-list-first-deposit-start", "member-list-first-deposit-end"), "member-list-date")}
        ${field("最后充值", dateRange("member-list-last-deposit-start", "member-list-last-deposit-end"), "member-list-date")}
        ${field("最后投注", dateRange("member-list-last-bet-start", "member-list-last-bet-end"), "member-list-date")}
        ${field("金额", moneyRange("member-list-amount", "金额"), "member-list-money")}
      `;
      const advancedOpen = appState.memberListAdvancedOpen;

      return `
        <div class="member-list-shell">
          <div class="member-list-tabs" role="tablist" aria-label="会员中心二级页面快捷切换">
            ${tabButtons}
          </div>
          <div class="member-list-filter-panel">
            <div class="member-list-filter-toolbar">
              <button class="member-list-advanced-toggle ${advancedOpen ? "active" : ""}" type="button" aria-expanded="${advancedOpen ? "true" : "false"}" onclick="toggleMemberListAdvancedFilters()">
                <i data-lucide="sliders-horizontal" aria-hidden="true"></i>
                高级筛选
              </button>
              <div class="member-list-form-actions">
                <button class="btn" type="button" onclick="resetMemberListFilters()">重置</button>
                <button class="btn blue" type="button" onclick="runQuery()">查询</button>
              </div>
            </div>
            <div class="member-list-filter-grid primary" aria-label="会员列表常用筛选">
              ${primaryFilters}
            </div>
            <div class="member-list-filter-advanced ${advancedOpen ? "open" : ""}" aria-label="会员列表高级筛选">
              <div class="member-list-filter-advanced-inner">
                <div class="member-list-filter-grid advanced">
                  ${advancedFilters}
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function getMemberListRowEntries(module) {
      const levelColIndex = module.columns.indexOf("会员层级");
      return module.rows
        .map((row, sourceIndex) => ({ row, sourceIndex }))
        .filter(({ row }) => {
          if (appState.tab !== "全部" && !row.join(" ").includes(appState.tab) && row[row.length - 1] !== appState.tab) return false;
          if (appState.memberListLevelFilter && row[levelColIndex] !== appState.memberListLevelFilter) return false;
          return true;
        });
    }

    function renderMemberListPager(total, currentPage, pageSize, totalPages) {
      const pageSizeOptions = [5, 10, 15, 20, 50, 100];
      const pageItems = [];
      if (totalPages <= 7) {
        for (let page = 1; page <= totalPages; page += 1) pageItems.push(page);
      } else {
        pageItems.push(1);
        if (currentPage > 3) pageItems.push("...");
        const start = Math.max(2, currentPage - 1);
        const end = Math.min(totalPages - 1, currentPage + 1);
        for (let page = start; page <= end; page += 1) pageItems.push(page);
        if (currentPage < totalPages - 2) pageItems.push("...");
        pageItems.push(totalPages);
      }
      const renderPageItem = (item) => {
        if (item === "...") return `<span>...</span>`;
        if (item === currentPage) return `<span class="page-current">${item}</span>`;
        return `<button type="button" class="page-link" onclick="setMemberListPage(${item})">${item}</button>`;
      };
      return `
        <div class="vip-pager member-list-pager" aria-label="会员列表分页">
          <span>共 <b>${total}</b> 条数据</span>
          <button type="button" class="page-link ${currentPage <= 1 ? "disabled" : ""}" ${currentPage <= 1 ? "disabled" : `onclick="setMemberListPage(${currentPage - 1})"`}>&lt;</button>
          ${pageItems.map(renderPageItem).join("")}
          <button type="button" class="page-link ${currentPage >= totalPages ? "disabled" : ""}" ${currentPage >= totalPages ? "disabled" : `onclick="setMemberListPage(${currentPage + 1})"`}>&gt;</button>
          <select class="vip-select" aria-label="每页条数" onchange="setMemberListPageSize(Number(this.value))">
            ${pageSizeOptions.map((size) => `<option value="${size}" ${pageSize === size ? "selected" : ""}>${size} 条/页</option>`).join("")}
          </select>
          <span>跳至</span>
          <input class="member-list-jump" type="number" min="1" max="${totalPages}" value="${currentPage}" aria-label="跳转页码" onkeydown="if (event.key === 'Enter') jumpMemberListPage(this.value)" />
          <span>页</span>
        </div>
      `;
    }

    function renderMemberListActionCell(rowIndex) {
      const memberModule = modules.find((item) => item.id === "member");
      const row = memberModule.rows[rowIndex] || memberModule.rows[0];
      const memberId = rowValue(memberModule, row, "会员ID");
      const notify = (action) => `showToast('会员 ${memberId}：${action}已进入处理流程')`;
      const renderActionDropdown = (label, items) => `
        <details class="member-list-action-dropdown">
          <summary class="member-list-action-trigger">${label}</summary>
          <div class="member-list-action-dropdown-menu" role="menu" aria-label="${label}">
            ${items.map((item) => `
              <button type="button" class="member-list-action-menu-item" role="menuitem" onclick="${notify(item)}">${item}</button>
            `).join("")}
          </div>
        </details>
      `;
      const renderActionButton = (label) => {
        if (label === "修改VIP等级") {
          return `<button type="button" class="member-list-action-trigger" onclick="openMemberVipEditModal(${rowIndex})">${label}</button>`;
        }
        if (label === "修改基本信息") {
          return `<button type="button" class="member-list-action-trigger" onclick="openMemberBasicInfoModal(${rowIndex})">${label}</button>`;
        }
        return `<button type="button" class="member-list-action-trigger" onclick="${notify(label)}">${label}</button>`;
      };
      return `
        <td class="member-list-sticky-col">
          <div class="member-list-actions" aria-label="会员行操作">
            <div class="member-list-actions-row">
              ${renderActionDropdown("黑名单", ["登录锁定", "充值锁定", "提款锁定"])}
              ${renderActionDropdown("密码相关", ["登录密码重置", "资金密码重置"])}
            </div>
            <div class="member-list-actions-row">
              ${renderActionButton("修改VIP等级")}
              ${renderActionButton("设为代理")}
            </div>
            <div class="member-list-actions-row">
              ${renderActionButton("修改基本信息")}
              ${renderActionButton("实名相关")}
            </div>
          </div>
        </td>
      `;
    }

    function renderTable(module) {
      const rows = module.rows.filter((row) => {
        if (appState.tab === "全部") return true;
        return row.join(" ").includes(appState.tab) || row[row.length - 1] === appState.tab;
      });
      let visibleRows = rows.length ? rows : module.rows;
      const isMemberListTable = module.id === "member" && module.subnav[appState.subIndex] === "会员列表";
      let memberListEntries = [];
      let memberListPage = 1;
      let memberListPageSize = 10;
      let memberListTotalPages = 1;
      if (isMemberListTable) {
        memberListEntries = getMemberListRowEntries(module);
        memberListPageSize = appState.memberListPageSize || 10;
        memberListTotalPages = Math.max(1, Math.ceil(memberListEntries.length / memberListPageSize));
        memberListPage = Math.min(Math.max(1, appState.memberListPage || 1), memberListTotalPages);
        if (memberListPage !== appState.memberListPage) appState.memberListPage = memberListPage;
        const pageStart = (memberListPage - 1) * memberListPageSize;
        visibleRows = memberListEntries.slice(pageStart, pageStart + memberListPageSize).map((entry) => entry.row);
      } else if (appState.memberListLevelFilter) {
        const levelColIndex = module.columns.indexOf("会员层级");
        visibleRows = visibleRows.filter((row) => row[levelColIndex] === appState.memberListLevelFilter);
      }
      const memberListTotal = isMemberListTable ? memberListEntries.length : 0;
      const memberListPageStart = isMemberListTable ? (memberListPage - 1) * memberListPageSize : 0;

      return `
        <div class="panel" style="position: relative;">
          <div class="loading-mask ${appState.loading ? "show" : ""}">
            <div class="loader-line" aria-label="加载中"></div>
          </div>
          ${isMemberListTable ? "" : `
            <div class="panel-head">
              <div class="panel-title">${module.subnav[appState.subIndex]}列表</div>
              <div class="state-tabs" role="tablist" aria-label="${module.title}状态筛选">
                ${module.tabs.map((tab) => `
                  <button type="button" class="${appState.tab === tab ? "active" : ""}" onclick="setTab('${tab}')">${tab}</button>
                `).join("")}
              </div>
            </div>
          `}
          <div class="table-tools ${isMemberListTable ? "member-list-table-tools" : ""}">
            <div class="summary-line">
              <span>已选 <b>${appState.selectedRows.size}</b> 项</span>
              <span>当前口径：<b>${isMemberListTable && appState.memberListLevelFilter ? `会员层级 = ${appState.memberListLevelFilter}` : module.subnav[appState.subIndex]}</b></span>
              ${isMemberListTable && appState.memberListLevelFilter ? `<span>查询结果：<b>${memberListTotal}</b> 条</span>` : ""}
              <span>币种：<b>MXN</b></span>
            </div>
            <div class="tool-actions">
              ${isMemberListTable ? `
                <button class="btn blue" type="button" onclick="openMemberBatchModal()"><i data-lucide="check-check" aria-hidden="true"></i>批量操作</button>
                <button class="btn blue" type="button" onclick="openMemberCreateModal()"><i data-lucide="plus" aria-hidden="true"></i>新增</button>
                <button class="btn" type="button" onclick="showToast('已生成导出任务，可在报表中心查看')"><i data-lucide="download" aria-hidden="true"></i>导出</button>
              ` : `
                <button class="btn" type="button" onclick="showToast('已生成导出任务，可在报表中心查看')"><i data-lucide="download" aria-hidden="true"></i>导出</button>
                <button class="btn" type="button" onclick="openConfigModal()"><i data-lucide="sliders-horizontal" aria-hidden="true"></i>字段配置</button>
                <button class="btn blue" type="button" onclick="showToast('批量审批入口已进入待办流')"><i data-lucide="check-check" aria-hidden="true"></i>批量处理</button>
              `}
            </div>
          </div>
          <div class="data-table-wrap ${isMemberListTable ? "member-list-table-wrap" : ""}">
            <table class="${isMemberListTable ? "member-list-table" : ""}">
              <thead>
                <tr>
                  <th style="width: 44px;"><input type="checkbox" aria-label="全选" onclick="toggleAllRows(this.checked)" /></th>
                  ${module.columns.map((column) => `<th>${column}</th>`).join("")}
                  ${isMemberListTable ? '<th class="member-list-sticky-col member-list-actions-head">操作</th>' : "<th>操作</th>"}
                </tr>
              </thead>
              <tbody>
                ${visibleRows.map((row, pageRowIndex) => {
                  const rowIndex = isMemberListTable
                    ? (memberListEntries[memberListPageStart + pageRowIndex]?.sourceIndex ?? pageRowIndex)
                    : pageRowIndex;
                  const displayIndex = isMemberListTable ? memberListPageStart + pageRowIndex + 1 : pageRowIndex + 1;
                  return `
                  <tr>
                    <td><input type="checkbox" aria-label="选择第${displayIndex}行" ${appState.selectedRows.has(rowIndex) ? "checked" : ""} onclick="toggleRow(${rowIndex}, this.checked)" /></td>
                    ${row.map((cell, cellIndex) => {
                      const columnName = module.columns[cellIndex];
                      if (columnName === "序号") {
                        return `<td><span class="sequence-cell">${cell}</span></td>`;
                      }
                      if (columnName === "会员ID") {
                        return `<td>${cell && cell !== "-" ? `<a class="table-link" href="javascript:void(0)" aria-label="打开会员 ${cell} 详情" onclick="openMemberDetail(${rowIndex})">${cell}</a>` : "-"}</td>`;
                      }
                      if (columnName === "邀请ID") {
                        return `<td>${cell && cell !== "-" ? `<a class="table-link" href="javascript:void(0)" onclick="showToast('已打开${columnName} ${cell} 的关联信息')">${cell}</a>` : "-"}</td>`;
                      }
                      if (columnName === "状态") {
                        return `<td>${statusBadge(cell)}</td>`;
                      }
                      if (cellIndex === 0) {
                        return `<td><div class="row-main"><strong>${cell}</strong><span>${module.subnav[appState.subIndex]} · ID ${module.id.toUpperCase()}-${rowIndex + 1001}</span></div></td>`;
                      }
                      if (String(cell).startsWith("+")) {
                        return `<td class="amount-positive">${cell}</td>`;
                      }
                      if (String(cell).startsWith("-")) {
                        return `<td class="amount-negative">${cell}</td>`;
                      }
                      return `<td>${cell}</td>`;
                    }).join("")}
                    ${isMemberListTable ? renderMemberListActionCell(rowIndex) : `
                      <td>
                        <div class="operation">
                          <button type="button" class="link-btn" aria-label="查看 ${row[0]} 详情" onclick="openDrawer(${rowIndex})">详情</button>
                          <button type="button" class="link-btn" aria-label="复核 ${row[0]}" onclick="showToast('已提交复核任务')">复核</button>
                        </div>
                      </td>
                    `}
                  </tr>
                `;
                }).join("")}
              </tbody>
            </table>
          </div>
          ${isMemberListTable ? renderMemberListPager(memberListTotal, memberListPage, memberListPageSize, memberListTotalPages) : ""}
        </div>
      `;
    }

    function renderMemberLevelManagement() {

          ${renderLevelActions("levels")}

    function parseLevelDuration(timeStr) {
      const text = String(timeStr || "").trim();
      const durationMatch = text.match(/(\d+)\s*天\s*(\d+)\s*小时\s*(\d+)\s*分/);
      if (durationMatch) {
        return {
          days: Number(durationMatch[1]) || 0,
          hours: Number(durationMatch[2]) || 0,
          minutes: Number(durationMatch[3]) || 0
        };
      }
      const parts = text.split("~").map((part) => part.trim());
      if (parts.length !== 2 || !parts[0] || !parts[1]) {
        return { days: 0, hours: 0, minutes: 0 };
      }
      const start = new Date(parts[0].replace(" ", "T"));
      const end = new Date(parts[1].replace(" ", "T"));
      if (Number.isNaN(start.getTime()) || Number.isNaN(end.getTime()) || end < start) {
        return { days: 0, hours: 0, minutes: 0 };
      }
      const totalMinutes = Math.floor((end.getTime() - start.getTime()) / 60000);
      const days = Math.floor(totalMinutes / (24 * 60));
      const hours = Math.floor((totalMinutes % (24 * 60)) / 60);
      const minutes = totalMinutes % 60;
      return { days, hours, minutes };
    }

    function setLevelDurationField(field, value) {
      const limits = {
        levelTimeDays: { min: 0, max: 99999 },
        levelTimeHours: { min: 0, max: 24 },
        levelTimeMinutes: { min: 0, max: 60 }
      };
      const rule = limits[field];
      if (!rule) return;
      const parsed = Number(value);
      const safeValue = Number.isFinite(parsed) ? Math.min(rule.max, Math.max(rule.min, Math.floor(parsed))) : rule.min;
      appState[field] = safeValue;
    }

                  ${groupOptions.map((group) => `<option ${group === tagGroup ? "selected" : ""}>${group}</option>`).join("")}
                </select>
              </div>
              <div class="vip-modal-line">
                <label for="tag-add-rule">标签规则：</label>
                <textarea id="tag-add-rule" placeholder="请输入标签规则">${tagRule}</textarea>
              </div>
              <div class="vip-modal-line">
                <label for="tag-add-remark">备注：</label>
                <textarea id="tag-add-remark" placeholder="请输入备注">${tagRemark}</textarea>
              </div>
              <div class="vip-modal-line">
                <span class="vip-modal-label">状态：</span>
                <div class="vip-radio-group">
                  <label class="vip-radio"><input type="radio" name="tag-add-status" ${tagStatus === "开启" ? "checked" : ""} /> 开启</label>
                  <label class="vip-radio"><input type="radio" name="tag-add-status" ${tagStatus === "关闭" ? "checked" : ""} /> 关闭</label>
                </div>
              </div>
            </div>
            <div class="modal-foot vip-modal-foot">
              <button class="btn blue" type="button" onclick="closeConfigModal(); showToast('${isEdit ? "标签修改已保存" : "标签已保存为原型数据"}')">确定</button>
            </div>
          </div>
        `;
        };
        const renderTagGroupModal = () => {
          const isEdit = appState.modalMode === "tagGroupEdit";
          const group = memberTagGroupRows()[appState.tagGroupEditRow] || memberTagGroupRows()[0];
          const title = isEdit ? "编辑分组" : "新增分组";
          const groupId = isEdit ? `GRP-${2000 + appState.tagGroupEditRow + 1}` : "";
          const groupName = isEdit ? group[1] : "";
          const groupDesc = isEdit ? group[3] : "";
          const groupOwner = isEdit ? group[4] : "";
          const groupStatus = isEdit ? group[5] : "开启";
          return `
          <div class="modal vip-modal" role="dialog" aria-modal="true" aria-label="${title}">
            <div class="modal-head">
              <strong>${title}</strong>
              <button class="icon-button" type="button" aria-label="关闭${title}弹窗" onclick="closeConfigModal()"><i data-lucide="x" aria-hidden="true"></i></button>
            </div>
            <div class="modal-body vip-modal-body">
              <div class="vip-modal-line">
                <label for="tag-group-id">分组ID：</label>
                <input id="tag-group-id" type="text" value="${groupId}" placeholder="保存后自动生成" ${isEdit ? "readonly aria-readonly=\"true\"" : ""} />
              </div>
              <div class="vip-modal-line">
                <label for="tag-group-name">分组名称：</label>
                <input id="tag-group-name" type="text" value="${groupName}" placeholder="请输入分组名称" />
              </div>
              <div class="vip-modal-line">
                <label for="tag-group-desc">用途说明：</label>
                <textarea id="tag-group-desc" placeholder="请输入用途说明">${groupDesc}</textarea>
              </div>
              <div class="vip-modal-line">
                <label for="tag-group-owner">负责人：</label>
                <input id="tag-group-owner" type="text" value="${groupOwner}" placeholder="请输入负责人" />
              </div>
              <div class="vip-modal-line">
                <span class="vip-modal-label">状态：</span>
                <div class="vip-radio-group">
                  <label class="vip-radio"><input type="radio" name="tag-group-status" ${groupStatus === "开启" ? "checked" : ""} /> 开启</label>
                  <label class="vip-radio"><input type="radio" name="tag-group-status" ${groupStatus === "关闭" ? "checked" : ""} /> 关闭</label>
                </div>
              </div>
            </div>
            <div class="modal-foot vip-modal-foot">
              <button class="btn blue" type="button" onclick="closeConfigModal(); showToast('${isEdit ? "分组修改已保存" : "分组已保存为原型数据"}')">确定</button>
            </div>
          </div>
        `;
        };
        if (appState.modalMode === "vipAddLevel") modal.innerHTML = renderAddLevelModal();
        if (appState.modalMode === "vipBatchLevel") modal.innerHTML = renderBatchLevelModal();
        if (appState.modalMode === "vipAddMember") modal.innerHTML = renderAddMemberModal();
        if (appState.modalMode === "tagBatch") modal.innerHTML = renderBatchTagModal();
        if (["tagAdd", "tagEdit"].includes(appState.modalMode)) modal.innerHTML = renderTagModal();
        if (["tagGroupAdd", "tagGroupEdit"].includes(appState.modalMode)) modal.innerHTML = renderTagGroupModal();
        return;
      }
      modal.innerHTML = appState.modalOpen ? `
        <div class="modal" role="dialog" aria-modal="true" aria-label="页面配置">
          <div class="modal-head">
            <strong>${module.title} · 页面配置</strong>
            <button class="icon-button" type="button" aria-label="关闭配置弹窗" onclick="closeConfigModal()"><i data-lucide="x" aria-hidden="true"></i></button>
          </div>
          <div class="modal-body">
            <div class="field">
              <label for="config-name">配置名称</label>
              <input id="config-name" type="text" value="${module.subnav[appState.subIndex]}默认视图" />
            </div>
            <div class="field">
              <label for="config-scope">适用范围</label>
              <select id="config-scope">
                <option>当前商户 979</option>
                <option>全部商户</option>
                <option>指定角色</option>
              </select>
            </div>
            <div class="field">
              <label for="config-approval">审批策略</label>
              <select id="config-approval">
                <option>敏感字段导出需审批</option>
                <option>全部操作需审批</option>
                <option>仅记录审计日志</option>
              </select>
            </div>
            <div class="field">
              <label for="config-notify">通知渠道</label>
              <select id="config-notify">
                <option>消息中心 + 站内信</option>
                <option>消息中心 + Push</option>
                <option>不通知</option>
              </select>
            </div>
            <div class="field wide-field">
              <label for="config-fields">展示字段</label>
              <textarea id="config-fields">${module.columns.join("、")}</textarea>
            </div>
            <div class="field wide-field">
              <label for="config-note">配置说明</label>
              <textarea id="config-note">用于${module.title}的运营、财务或风控人员日常处理。保存后会写入系统管理的操作日志，并可在报表中心追踪导出记录。</textarea>
            </div>
          </div>
          <div class="modal-foot">
            <button class="btn" type="button" onclick="closeConfigModal()">取消</button>
            <button class="btn primary" type="button" onclick="closeConfigModal(); showToast('页面配置已保存')"><i data-lucide="save" aria-hidden="true"></i>保存配置</button>
          </div>
        </div>
      ` : "";
    }

    function jumpByTitle(title) {
      const target = modules.find((item) => item.title === title);
      if (target) switchModule(target.id);
      else showToast(`${title}已加入联动入口`);
    }

    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeDrawer();
        closeConfigModal();
      }
    });

    renderApp();
  </script>
